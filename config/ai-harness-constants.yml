# ai-harness-constants 設定ファイル
# 配置先: <プロジェクトルート>/.claude/harness/config/ai-harness-constants.yml
# 書き込み系ツール（Write / Edit / MultiEdit）の PostToolUse で、書き込んだソースファイルを
# tree-sitter で AST 解析し、数値・文字列リテラル（ハードコード値）を検出したら deny（exit 2）する。
# 許可された定数ファイル（allow）だけがハードコード値を持てる。
# 値が 0 / 1 の整数リテラル（0x00 / 1L / 1i32 等の表記違いを含む）は範囲外＝検出しない。
# 2 以上の整数・小数・指数・虚数は意味を持つ値として検出する。

# 検査エントリ。各エントリは pattern（対象）と allow（許可先, 単一 glob）のマップ。
#   pattern     … ハードコード値を許可しない対象ソースの glob（** / * / ? 使用可）
#   allow       … ハードコード値を許可する定数ファイルの glob。
#                 - 単一のみ（リスト不可）
#                 - ** は使用不可（*.java のような形式は可）
#                 - pattern の内側（pattern にマッチするパス）であること
#   same-string … true で、allow にマッチする定数ファイル群を横断し、同じ文字列リテラルが
#                 2 箇所以上にあれば deny（exit 2）。同じ値の定数の二重定義を潰す。
#                 同一判定はリテラル表記そのまま（"a" と 'a' は別物）。空文字列 "" も対象。
#                 数値は対象外。省略時は false（true / false 以外を書くと設定エラー）。
# テスト等を検査対象外にしたい場合は、単に pattern に含めなければよい
# （どの pattern にもマッチしないファイルは管理対象外＝許可）。
files:
  - pattern: "src/main/java/**/*.java"
    allow: "src/main/java/com/example/app/constants/*.java"
    same-string: true
  - pattern: "frontend/main/**/*.ts"
    allow: "frontend/main/constants/*.ts"

# ai-harness-main --fire での能動スキャン設定。
# 上記 pattern に合致する全ソースを走査し、allow 以外にハードコード値があれば exit 2。
#
# exclude に一致するディレクトリを部分木ごと除外し（どの深さでも枝刈り）、一致するファイルも走査から外す。
# exclude は pattern と同じ glob を解釈する（**=任意段のディレクトリ / *=区切りを跨がない任意長 / ?=任意1文字）。
# フルパスと各 / 区切りサフィックスに照合されるため、名前指定・パス指定・glob のいずれも書ける:
#   - node_modules      … どの深さの node_modules も除外
#   - .claude/harness   … ハーネス管理ディレクトリをパス指定で除外
#   - "**/dist"         … 任意段下の dist を除外
#
# gitignore: true にすると、git が無視する（未追跡かつ ignore の）ファイル／ディレクトリも走査対象から外す。
# 各階層の .gitignore・否定(!)・core.excludesFile・.git/info/exclude を尊重（git に問い合わせる）。
# git 未導入・非リポジトリのときは警告して無効化し、スキャンは継続する。既定は false。
fire:
  gitignore: true
  exclude:
    - .git
    - node_modules
